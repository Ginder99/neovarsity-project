name: Auth Service CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-ci-cd.yml'
  push:
    branches: [main, master]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-ci-cd.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run auth-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: ./gradlew test

  deploy:
    name: Deploy auth-service to GKE
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
      GKE_NAMESPACE: ${{ secrets.GKE_NAMESPACE }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }}
      IMAGE_NAME: auth-service
      DEPLOYMENT_NAME: ${{ secrets.AUTH_SERVICE_DEPLOYMENT_NAME }}
      CONTAINER_NAME: ${{ secrets.AUTH_SERVICE_CONTAINER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "${IMAGE_URI}" ./auth-service
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials "${GKE_CLUSTER}" --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}"

      - name: Deploy updated image
        run: |
          kubectl -n "${GKE_NAMESPACE}" set image deployment/"${DEPLOYMENT_NAME}" "${CONTAINER_NAME}"="${IMAGE_URI}"
          kubectl -n "${GKE_NAMESPACE}" rollout status deployment/"${DEPLOYMENT_NAME}"
