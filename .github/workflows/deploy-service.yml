name: Reusable - Deploy Service to Cloud Run

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      cloudsql_instance:
        required: false
        type: string
        default: ""
      runtime_service_account:
        required: false
        type: string
        default: ""
      secrets_mapping:
        required: false
        type: string
        default: ""
      env_vars:
        required: false
        type: string
        default: ""
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_PROJECT_NUMBER:
        required: true

env:
  REGION: us-central1
  REPO: vms-services

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push image
        working-directory: ${{ inputs.service_path }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ inputs.service_name }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service_name }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ inputs.service_name }}:${{ github.sha }}
          flags: >-
            ${{ inputs.cloudsql_instance != '' && format('--add-cloudsql-instances={0}', inputs.cloudsql_instance) || '' }}
            --service-account=${{ inputs.runtime_service_account }}
          secrets: ${{ inputs.secrets_mapping }}
