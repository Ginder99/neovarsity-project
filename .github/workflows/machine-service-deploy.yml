name: Deploy machine-service

on:
  push:
    branches: [release]
    paths:
      - 'machine-service/**'
      - '.github/workflows/machine-service-deploy.yml'

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-service.yml
    with:
      service_name: machine-service
      service_path: machine-service
      cloudsql_instance: scalar-neovarsity-vms:us-central1:vms-db-instance
      secrets_mapping: "DB_PASSWORD=machine-db-user-password:latest,JWT_SECRET=jwt-secret:latest"
      runtime_service_account: machine-service-runtime@scalar-neovarsity-vms.iam.gserviceaccount.com
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
