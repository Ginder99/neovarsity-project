spring:
  application:
    name: machine-service
  datasource:
    url: jdbc:mysql://localhost:3306/vms_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
server:
  port: 9002