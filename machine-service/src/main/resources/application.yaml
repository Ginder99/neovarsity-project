spring:
  application:
    name: machine-service
  datasource:
    url: jdbc:mysql://localhost:3306/vms_db
    username: ${DB_USER:application_user}
    password: ${DB_PASSWORD:App_user_pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      show_sql: true
      format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: ${JWT_SECRET:this-is-a-big-secret-key-for-jwt-token-generation}
  expiration-ms: 3600000
server:
  port: 9002