spring:
  application:
    name: order-service
    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: false
  datasource:
    url: jdbc:mysql://localhost:3306/vms_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 9003

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

internal-security:
  service-secret: ${INTERNAL_SERVICE_SECRET}

refresh-token:
  expiration: 604800000

password-reset-token:
  expiration:
    forgot: 3600
    new-user: 3600

logging:
  level:
    com.vms.auth: INFO
    org.springframework.web: ERROR
