spring:
  application:
    name: order-service
    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: false
  datasource:
    url: jdbc:mysql:///vms_db?cloudSqlInstance=scalar-neovarsity-vms:us-central1:vms-db-instance&socketFactory=com.google.cloud.sql.mysql.SocketFactory
    username: order_service_user
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

internal-security:
  service-secret: ${INTERNAL_SERVICE_SECRET}

refresh-token:
  expiration: 604800000

password-reset-token:
  expiration:
    forgot: 3600
    new-user: 3600

logging:
  level:
    com.vms.auth: INFO
    org.springframework.web: ERROR
