spring:
  application:
    name: payment-service
    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: false
  datasource:
    url: jdbc:mysql://localhost:3306/vms_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 9004

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

stripe:
  api-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

internal-security:
  service-secret: ${INTERNAL_SERVICE_SECRET}
  service-name: payment-service

order-service:
  base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:9003}
  payment-callback-path: /api/v1/orders/internal/{orderId}/payment
